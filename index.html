<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Dashboard</title>
</head>
<body>
<div class="container">
<aside class="sidebar">
        <div class="branding">
            <a href="#">
                <img class="branding-icon" src="icons/dashboard.svg" alt="">
                <span>Dashboard</span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <ul class="user-nav">
                <li><a href="#"><img class="sidebar-icons" src="icons/home.svg" alt=""><span>Home</span></a></li>
                <li><a href="#"><img class="sidebar-icons" src="icons/profile.svg" alt=""><span>Profile</span></a></li>
                <li><a href="#"><img class="sidebar-icons" src="icons/messages.svg" alt=""><span>Messages</span></a></li>
                <li><a href="#"><img class="sidebar-icons" src="icons/history.svg" alt=""><span>History</span></a></li>
                <li><a href="#"><img class="sidebar-icons" src="icons/tasks.svg" alt=""><span>Tasks</span></a></li>
                <li><a href="#"><img class="sidebar-icons" src="icons/communities.svg" alt=""><span>Communities</span></a></li>
            </ul>
        </nav>

        <nav class="sidebar-nav">
            <ul class="tech-nav">
                <li><a href="#"><img class="sidebar-icons" src="icons/settings.svg" alt=""><span>Settings</span></a></li>
                <li><a href="#"><img class="sidebar-icons" src="icons/support.svg" alt=""><span>Support</span></a></li>
                <li><a href="#"><img class="sidebar-icons" src="icons/privacy.svg" alt=""><span>Privacy</span></a></li>
            </ul>
        </nav>

    </aside>

    <header class="header">
        <div class="first-row">
            <div class="first-row-left">
                <label for="site-search"><img src="icons/search.svg" alt="" class="search-icon"></label>
                <input type="search" id="site-search">
            </div>

            <div class="first-row-right">
                <img src="icons/bell.svg" alt="" class="notification-icon">
                <img src="images/1.png" alt="" class="user-avatar">
                <span class="user-name">Morgan Oakley</span>
            </div>
        </div>

        <div class="second-row">
            <div class="second-row-left">
                <img src="images/1.png" alt="" class="user-avatar-big">
                <p class="greeting">
                    Hi there, <br>
                    <span class="greeting-user-name">Morgan Oakley (@morgan)</span>
                </p>
            </div>

            <div class="second-row-right">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
    </header>

    <main class="content"></main>
</div>
</body>
</html>
